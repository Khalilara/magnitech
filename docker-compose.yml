# =============================================================================
#  Maghitech — stack de production
#  Démarrage : cp .env.example .env  &&  docker compose up -d --build
#
#  Réseaux :
#    edge    → exposé via Traefik (frontends, API) — accès Internet sortant
#    app     → interne : frontends (SSR) ⇄ API, sans passer par Internet
#    data    → interne : API / workers ⇄ PostgreSQL, Redis, Meilisearch
#    egress  → sortie Internet pour les workers (Stripe, transporteurs)
#    socket  → interne : Traefik ⇄ docker-socket-proxy (socket Docker jamais exposé)
# =============================================================================
name: maghitech

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }
  security_opt: ["no-new-privileges:true"]

x-api-env: &api-env
  APP_ENV: production
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
  MEILI_URL: http://meilisearch:7700
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL}
  JWT_SECRET: ${JWT_SECRET}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
  CARRIER_WEBHOOK_SECRETS: ${CARRIER_WEBHOOK_SECRETS}
  DEFAULT_COMMISSION_BPS: ${DEFAULT_COMMISSION_BPS:-1200}
  RETURN_WINDOW_DAYS: ${RETURN_WINDOW_DAYS:-14}
  CORS_ORIGINS: https://${DOMAIN},https://vendeur.${DOMAIN},https://admin.${DOMAIN}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
  API_PUBLIC_URL: https://api.${DOMAIN}
  STOREFRONT_URL: https://${DOMAIN}
  DASHBOARD_URL: https://admin.${DOMAIN}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  SENTRY_DSN: ${SENTRY_DSN:-}

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile
  target: runtime

services:
  # ---------------------------------------------------------------- Edge -----
  socket-proxy:
    <<: *common
    image: tecnativa/docker-socket-proxy:0.3
    environment:
      CONTAINERS: 1          # Traefik n'a besoin que de lire les conteneurs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket]

  traefik:
    <<: *common
    image: traefik:v3.2
    depends_on: [socket-proxy]
    command:
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=maghitech_edge
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http3=true
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --ping=true
      - --accesslog=true
      - --accesslog.format=json
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - letsencrypt:/letsencrypt
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks: [edge, socket]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ------------------------------------------------------------- Backend -----
  migrate:
    # Job one-shot : applique les migrations Alembic avant le démarrage de l'API
    build: *api-build
    image: ${REGISTRY:-ghcr.io/maghitech}/api:${TAG:-latest}
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]
    restart: "no"

  api:
    <<: *common
    build: *api-build
    image: ${REGISTRY:-ghcr.io/maghitech}/api:${TAG:-latest}
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
    networks: [edge, app, data]
    read_only: true
    tmpfs: [/tmp]
    deploy:
      replicas: ${API_REPLICAS:-2}
      resources:
        limits: { cpus: "2", memory: 1G }
    labels:
      - traefik.enable=true
      - traefik.http.services.api.loadbalancer.server.port=8000
      - traefik.http.services.api.loadbalancer.healthcheck.path=/health
      # API publique (rate-limitée)
      - traefik.http.routers.api.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.routers.api.service=api
      - traefik.http.routers.api.middlewares=secure-headers@file,compress@file,api-ratelimit@file
      # Webhooks Stripe / transporteurs (pas de rate-limit, priorité haute)
      - traefik.http.routers.api-webhooks.rule=Host(`api.${DOMAIN}`) && PathPrefix(`/v1/webhooks`)
      - traefik.http.routers.api-webhooks.priority=100
      - traefik.http.routers.api-webhooks.entrypoints=websecure
      - traefik.http.routers.api-webhooks.tls.certresolver=le
      - traefik.http.routers.api-webhooks.service=api

  worker:
    <<: *common
    build: *api-build
    image: ${REGISTRY:-ghcr.io/maghitech}/api:${TAG:-latest}
    command:
      - celery
      - -A
      - app.workers.celery_app
      - worker
      - -Q
      - webhooks,orders,payouts,search,default
      - --concurrency=4
      - --max-tasks-per-child=500
      - --loglevel=INFO
    environment: *api-env
    depends_on:
      api: { condition: service_healthy }
    networks: [data, egress]
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits: { cpus: "2", memory: 1G }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 20s
      retries: 3

  beat:
    # Planificateur : libération des commissions, reversements, polling transporteurs
    <<: *common
    build: *api-build
    image: ${REGISTRY:-ghcr.io/maghitech}/api:${TAG:-latest}
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--schedule=/tmp/celerybeat-schedule", "--loglevel=INFO"]
    environment: *api-env
    depends_on:
      api: { condition: service_healthy }
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    deploy:
      replicas: 1   # NE JAMAIS scaler beat (tâches dupliquées)

  # ------------------------------------------------------------ Frontend -----
  storefront:
    <<: *common
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
    image: ${REGISTRY:-ghcr.io/maghitech}/storefront:${TAG:-latest}
    environment:
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    networks: [edge, app]
    deploy:
      replicas: ${STOREFRONT_REPLICAS:-2}
      resources:
        limits: { cpus: "1", memory: 768M }
    labels:
      - traefik.enable=true
      - traefik.http.routers.storefront.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)
      - traefik.http.routers.storefront.entrypoints=websecure
      - traefik.http.routers.storefront.tls.certresolver=le
      - traefik.http.routers.storefront.middlewares=www-to-apex@file,secure-headers@file,compress@file
      - traefik.http.services.storefront.loadbalancer.server.port=3000

  dashboard:
    # Une seule app Next.js, deux domaines : espace vendeur + back-office admin (RBAC)
    <<: *common
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
    image: ${REGISTRY:-ghcr.io/maghitech}/dashboard:${TAG:-latest}
    environment:
      API_INTERNAL_URL: http://api:8000
      ADMIN_HOST: admin.${DOMAIN}
      VENDOR_HOST: vendeur.${DOMAIN}
    depends_on:
      api: { condition: service_healthy }
    networks: [edge, app]
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    labels:
      - traefik.enable=true
      - traefik.http.services.dashboard.loadbalancer.server.port=3000
      - traefik.http.routers.vendeur.rule=Host(`vendeur.${DOMAIN}`)
      - traefik.http.routers.vendeur.entrypoints=websecure
      - traefik.http.routers.vendeur.tls.certresolver=le
      - traefik.http.routers.vendeur.service=dashboard
      - traefik.http.routers.vendeur.middlewares=secure-headers@file,compress@file
      - traefik.http.routers.admin.rule=Host(`admin.${DOMAIN}`)
      - traefik.http.routers.admin.entrypoints=websecure
      - traefik.http.routers.admin.tls.certresolver=le
      - traefik.http.routers.admin.service=dashboard
      - traefik.http.routers.admin.middlewares=admin-allowlist@docker,secure-headers@file,compress@file
      - traefik.http.middlewares.admin-allowlist.ipallowlist.sourcerange=${ADMIN_IP_ALLOWLIST}

  # ---------------------------------------------------------------- Data -----
  postgres:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=200
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=500
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  pg-backup:
    <<: *common
    image: prodrigestivill/postgres-backup-local:16
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: "-Z6 --format=custom"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - pgbackups:/backups
    networks: [data]

  redis:
    <<: *common
    image: redis:7.4-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction   # Redis sert aussi de broker Celery : on ne perd jamais une tâche
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  meilisearch:
    <<: *common
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    networks: [data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  edge:
    name: maghitech_edge
  app:
    internal: true
  data:
    internal: true
  egress: {}
  socket:
    internal: true

volumes:
  pgdata:
  pgbackups:
  redisdata:
  meilidata:
  letsencrypt:
