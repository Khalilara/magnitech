[project]
name = "maghitech-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",        # driver sync pour Alembic
  "alembic>=1.14",
  "redis>=5.2",
  "celery[redis]>=5.4",
  "stripe>=11.0",
  "httpx>=0.28",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "meilisearch-python-sdk>=3.0",
  "boto3>=1.35",
  "structlog>=24.4",
  "sentry-sdk[fastapi]>=2.19",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
